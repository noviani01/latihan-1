<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hitung umur Anda dengan mudah dalam tahun, bulan, dan hari."
    />
    <title>Kalkulator Umur</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="calculator">
      <div class="eyebrow"><span aria-hidden="true">✦</span> KALKULATOR UMUR</div>
      <h1>Sudah berapa lama<br />kamu <span>hidup?</span></h1>
      <p class="intro">
        Masukkan tanggal lahirmu dan temukan umurmu saat ini.
      </p>

      <form id="age-form" novalidate>
        <label for="birth-date">Tanggal lahir</label>
        <div class="input-row">
          <input
            id="birth-date"
            name="birth-date"
            type="date"
            autocomplete="bday"
            required
            aria-describedby="form-message"
          />
          <button type="submit">Hitung umur <span aria-hidden="true">→</span></button>
        </div>
        <p id="form-message" class="message" role="alert" aria-live="polite"></p>
      </form>

      <section id="result" class="result" aria-live="polite" hidden>
        <h2>Umurmu sekarang</h2>
        <div class="age-values">
          <div class="age-value">
            <strong id="years">0</strong>
            <span>Tahun</span>
          </div>
          <div class="age-value">
            <strong id="months">0</strong>
            <span>Bulan</span>
          </div>
          <div class="age-value">
            <strong id="days">0</strong>
            <span>Hari</span>
          </div>
        </div>
        <p id="birth-summary" class="birth-summary"></p>
      </section>

      <footer>Dihitung berdasarkan tanggal hari ini.</footer>
    </main>
  </body>
</html>
